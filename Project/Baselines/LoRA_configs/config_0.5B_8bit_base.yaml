model: "lmstudio-community/Qwen2.5-0.5B-Instruct-MLX-8bit"
train: true
data: "../data/processed"
adapter_path: "training_results/0.5B_model/adapters"

# Hyperparameters
iters: 3000
batch_size: 1
grad_accumulation_steps: 4
max_seq_length: 512
lr_schedule:
  name: cosine_decay
  arguments: [1e-4, 3000] # initial_lr, decay_steps
  warmup: 300
  warmup_init: 1e-6

# LoRA specific
lora_layers: 16
lora_parameters:
  rank: 16
  alpha: 16
  dropout: 0.05
  scale: 10.0

# Logging & Testing
save_every: 100
test_every: 100
test_batches: 20
