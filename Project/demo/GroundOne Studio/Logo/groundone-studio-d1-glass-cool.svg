<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="GroundOne Studio">
<defs>
<linearGradient id="d1-base" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#2F6BFF"></stop>
<stop offset="0.45" stop-color="#7B3CFF"></stop>
<stop offset="0.78" stop-color="#FF2D6F"></stop>
<stop offset="1" stop-color="#FF8A1F"></stop>
</linearGradient>
<linearGradient id="d1-sheen" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FFFFFF" stop-opacity="0.3"></stop>
<stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"></stop>
</linearGradient>
<linearGradient id="d1-body" gradientUnits="userSpaceOnUse" x1="200" y1="200" x2="850" y2="850">
<stop offset="0" stop-color="#FFFFFF" stop-opacity="0.3"></stop>
<stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"></stop>
</linearGradient>
<clipPath id="d1-clip"><rect width="1024" height="1024" rx="230"></rect></clipPath>
<filter id="d1-orb" filterUnits="userSpaceOnUse" x="-300" y="-300" width="1624" height="1624"><feGaussianBlur stdDeviation="90"></feGaussianBlur></filter>
<filter id="d1-refr" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
<feGaussianBlur stdDeviation="4"></feGaussianBlur>
<feColorMatrix type="saturate" values="1.4"></feColorMatrix>
<feComponentTransfer><feFuncR type="linear" slope="1.12"></feFuncR><feFuncG type="linear" slope="1.12"></feFuncG><feFuncB type="linear" slope="1.12"></feFuncB></feComponentTransfer>
</filter>
<filter id="d1-shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feGaussianBlur stdDeviation="26"></feGaussianBlur></filter>
<filter id="d1-caustic" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feGaussianBlur stdDeviation="34"></feGaussianBlur></filter>
<filter id="d1-edge" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feGaussianBlur stdDeviation="2.5"></feGaussianBlur></filter>
<filter id="d1-glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feGaussianBlur stdDeviation="10"></feGaussianBlur></filter>
<mask id="d1-tube" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
<path d="M 710 314 A 280 280 0 1 0 792 512 L 573.7 628.1 L 503 557.4" fill="none" stroke="#FFFFFF" stroke-width="116" stroke-linecap="round" stroke-linejoin="round"></path>
</mask>
<mask id="d1-rim" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
<path d="M 710 314 A 280 280 0 1 0 792 512 L 573.7 628.1 L 503 557.4" fill="none" stroke="#FFFFFF" stroke-width="116" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M 710 314 A 280 280 0 1 0 792 512 L 573.7 628.1 L 503 557.4" fill="none" stroke="#000000" stroke-width="104" stroke-linecap="round" stroke-linejoin="round"></path>
</mask>
<mask id="d1-tl" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
<path d="M 710 314 A 280 280 0 1 0 792 512 L 573.7 628.1 L 503 557.4" fill="none" stroke="#FFFFFF" stroke-width="116" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M 710 314 A 280 280 0 1 0 792 512 L 573.7 628.1 L 503 557.4" transform="translate(9 11)" fill="none" stroke="#000000" stroke-width="116" stroke-linecap="round" stroke-linejoin="round"></path>
</mask>
<mask id="d1-br" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
<path d="M 710 314 A 280 280 0 1 0 792 512 L 573.7 628.1 L 503 557.4" fill="none" stroke="#FFFFFF" stroke-width="116" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M 710 314 A 280 280 0 1 0 792 512 L 573.7 628.1 L 503 557.4" transform="translate(-9 -11)" fill="none" stroke="#000000" stroke-width="116" stroke-linecap="round" stroke-linejoin="round"></path>
</mask>
<mask id="d1-inner" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
<path d="M 710 314 A 280 280 0 1 0 792 512 L 573.7 628.1 L 503 557.4" fill="none" stroke="#FFFFFF" stroke-width="116" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M 710 314 A 280 280 0 1 0 792 512 L 573.7 628.1 L 503 557.4" transform="translate(-24 -28)" fill="none" stroke="#000000" stroke-width="116" stroke-linecap="round" stroke-linejoin="round"></path>
</mask>
<g id="d1-scene">
<rect width="1024" height="1024" fill="url(#d1-base)"></rect>
<g filter="url(#d1-orb)">
<circle cx="220" cy="200" r="260" fill="#36C4FF" fill-opacity="0.85"></circle>
<circle cx="880" cy="200" r="220" fill="#FF7AD9" fill-opacity="0.7"></circle>
<circle cx="300" cy="860" r="240" fill="#FF4FA8" fill-opacity="0.75"></circle>
<circle cx="860" cy="820" r="260" fill="#FFC93D" fill-opacity="0.9"></circle>
</g>
</g>
</defs>
<g clip-path="url(#d1-clip)">
<use href="#d1-scene" xlink:href="#d1-scene"></use>
<rect width="1024" height="1024" fill="url(#d1-sheen)"></rect>
<path d="M 710 314 A 280 280 0 1 0 792 512 L 573.7 628.1 L 503 557.4" transform="translate(0 28)" fill="none" stroke="#2A0A5E" stroke-opacity="0.35" stroke-width="116" stroke-linecap="round" stroke-linejoin="round" filter="url(#d1-shadow)"></path>
<path d="M 710 314 A 280 280 0 1 0 792 512 L 573.7 628.1 L 503 557.4" transform="translate(6 50)" fill="none" stroke="#FFF4D6" stroke-opacity="0.3" stroke-width="90" stroke-linecap="round" stroke-linejoin="round" filter="url(#d1-caustic)"></path>
</g>
<rect x="4" y="4" width="1016" height="1016" rx="226" fill="none" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="8"></rect>
<g mask="url(#d1-tube)">
<g filter="url(#d1-refr)"><use href="#d1-scene" xlink:href="#d1-scene" transform="matrix(1.14 0 0 1.14 -88 -92)"></use></g>
<rect width="1024" height="1024" fill="url(#d1-body)"></rect>
</g>
<g filter="url(#d1-glow)"><g mask="url(#d1-inner)"><rect width="1024" height="1024" fill="#FFFFFF" fill-opacity="0.22"></rect></g></g>
<g mask="url(#d1-rim)"><rect width="1024" height="1024" fill="#FFFFFF" fill-opacity="0.5"></rect></g>
<g filter="url(#d1-edge)"><g mask="url(#d1-br)"><rect width="1024" height="1024" fill="#FFE6F4" fill-opacity="0.75"></rect></g></g>
<g filter="url(#d1-edge)"><g mask="url(#d1-tl)"><rect width="1024" height="1024" fill="#FFFFFF" fill-opacity="0.95"></rect></g></g>
</svg>
