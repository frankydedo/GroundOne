[project]
name = "lightning-route"
version = "0.1.0"
description = "O(1) tool routing via logit extraction — a single forward pass, no text generation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0,<1",
    "uvicorn>=0.29.0,<1",
    "pydantic>=2.6.0,<3",
]

[project.optional-dependencies]
mlx = [
    "mlx>=0.17.0",
    "mlx-lm>=0.17.0",
]

[project.scripts]
lightning-route = "lightning_route.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lightning_route"]
