[project]
name = "lightning-route"
version = "0.1.0"
description = "A blazing-fast System One Router powered by MLX"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "mlx>=0.17.0",
    "mlx-lm>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lightning_route"]
