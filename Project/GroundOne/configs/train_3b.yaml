# GroundOne LoRA fine-tuning — Qwen2.5-3B-Instruct (MLX 8-bit), readout design (b)
# Run:   groundone train --config train_3b.yaml
# Same recipe as the 0.5B (train_0.5b.yaml) except size, data quantity and micro-batching: one night on a random
# subset of training answers (author's option A, 2026-10-07; a second night only if the dev is still improving).

# --- model and data -------------------------------------------------------------------------------------------
size: "3b"
data: "groundone"             # Project/data/processed/groundone/ (docs/dataset_plan.md)
train: "train"                # answer-level records (RAGTruth train split)
run: "g1-3b-b1"               # output: Project/outputs/models/<run>/ (never overwritten)
design: "b"                   # verdicts read at a marker after each scored sentence (dataset plan §8)
sample: 6500                  # random subset of training answers (~45K decisions, ~5.6 M tokens; measured ~0.75 M tokens/h)

# --- LoRA (identical to the 0.5B) -----------------------------------------------------------------------------
rank: 16
scale: 2.0
dropout: 0.05

# --- optimisation ---------------------------------------------------------------------------------------------
lr: 1.0e-4                   # same as the 0.5B (only ~400 steps: a lower LR would risk under-training)
warmup: 0.05                 # ~20 steps
epochs: 1.0
token_budget: 2304           # ~2 answers per micro-batch (longest answer ~2,100 tokens with markers)
max_rows: 4
accum: 8                     # ~16 answers per optimiser step, as for the 0.5B
seed: 1234

# --- evaluation, safety ---------------------------------------------------------------------------------------
eval_every: 80               # ~5 dev evaluations (~400 steps)
dev_file: "dev"
dev_sample: 200              # fixed dev subset (a full dev pass costs ~1 h on the 3B)
select: "bacc"               # best/ = highest mean three-way balanced accuracy over tasks
max_hours: 0                 # no time limit (author prefers late over truncated runs)
max_steps: 0
mem_gb: 10.0
