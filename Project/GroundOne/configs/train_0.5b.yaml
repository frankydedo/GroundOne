# GroundOne LoRA fine-tuning — Qwen2.5-0.5B-Instruct (MLX 8-bit)
# Run:   groundone train --config train_0.5b.yaml          (flags override, e.g. --run g1-05b-v2 --lr 2e-4)
# The resolved config is copied to models/<run>/config.yaml.

# --- model and data -------------------------------------------------------------------------------------------
size: "0.5b"                 # base model (GroundOne/src/groundone/config.py: BASE_MODELS)
data: "v1"                   # dataset version in Project/data/processed/ (see docs/phase1_report.md)
train: "train_05b"           # 42,910 rows: ANLI 21,000 + MiniCheck 13,990 + RAGTruth 7,920; 14.5 M tokens
run: "g1-05b-v1"             # output: Project/models/<run>/ (never overwritten)

# --- LoRA (plan §6.1: all linear layers of all blocks; coverage matters more than rank) -------------------------
rank: 16
scale: 2.0                   # LoRA scaling = alpha / rank, i.e. alpha = 32 (as Rizzo-Flow)
dropout: 0.05

# --- optimisation ---------------------------------------------------------------------------------------------
lr: 1.0e-4                   # peak learning rate (AdamW, no weight decay)
warmup: 0.03                 # share of steps with linear warm-up, then cosine decay to 0
epochs: 1.0
token_budget: 4096           # max padded tokens per micro-batch (rows * longest row)
max_rows: 16                 # max rows per micro-batch
accum: 2                     # micro-batches per optimiser step (≈ 20 examples per step on average)
seed: 1234

# --- evaluation, safety ---------------------------------------------------------------------------------------
eval_every: 250              # optimiser steps between dev evaluations; the best (lowest dev loss) is kept in best/
dev_size: 600                # fixed dev subset: 200 each from dev_anli, dev_ragtruth, dev_minicheck
max_hours: 7.0               # measured ≈ 11 s/step → a full epoch (2,235 steps) ≈ 7 h; stops cleanly, last + best saved
max_steps: 0                 # 0 = no limit (debug only)
mem_gb: 9.0                  # MLX memory limit (the memory guard kills the job below 2 GB free anyway)
