# GroundOne LoRA fine-tuning — Qwen2.5-0.5B-Instruct (MLX 8-bit)
# Run:   groundone train --config train_0.5b.yaml          (flags override, e.g. --run g1-05b-v2 --lr 2e-4)
# The resolved config is copied to models/<run>/config.yaml.

# --- model and data -------------------------------------------------------------------------------------------
size: "0.5b"                 # base model (GroundOne/src/groundone/config.py: BASE_MODELS)
data: "groundone"             # Project/data/processed/groundone/ (docs/dataset_plan.md)
train: "train"                # answer-level records (RAGTruth train split)
run: "g1-05b-b1"              # output: Project/models/<run>/ (never overwritten)

# --- LoRA (plan §6.1: all linear layers of all blocks; coverage matters more than rank) -------------------------
rank: 16
scale: 2.0                   # LoRA scaling = alpha / rank, i.e. alpha = 32 (as Rizzo-Flow)
dropout: 0.05

# --- optimisation ---------------------------------------------------------------------------------------------
lr: 1.0e-4                   # peak learning rate (AdamW, no weight decay)
warmup: 0.03                 # share of steps with linear warm-up, then cosine decay to 0
epochs: 1.0
token_budget: 4096           # max padded tokens per micro-batch (rows * longest row)
max_rows: 16                 # max rows per micro-batch
accum: 4                     # micro-batches per optimiser step (~16 answers, ~110 decisions, ~4-5 contradicted per step)
seed: 1234

# --- evaluation, safety ---------------------------------------------------------------------------------------
eval_every: 150              # optimiser steps between dev evaluations; the best checkpoint is kept in best/
design: "b"                  # verdicts read at a marker after each scored sentence (dataset plan §8)
sample: 0                    # all 13,203 training answers (~91K decisions, ~11.3 M tokens)
dev_file: "dev"              # full dev set (1,468 answers, 9,996 decisions); block = task
select: "bacc"               # best/ = highest mean three-way balanced accuracy over tasks
max_hours: 0                 # no time limit: the full epoch completes (design b, all answers: ≈ 5.5 h expected); author prefers late over truncated
max_steps: 0                 # 0 = no limit (debug only)
mem_gb: 9.0                  # MLX memory limit (the memory guard kills the job below 2 GB free anyway)
